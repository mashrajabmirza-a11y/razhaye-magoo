---
layout: default
---
<article class="entry">
  <h1>{{ page.title }}</h1>
  <div class="post-meta"><span>{{ page.date | date: "%Y-%m-%d" }}</span>{% if page.description %}<span>{{ page.description }}</span>{% endif %}</div>
  <div class="body">{{ content }}</div>
  {% if page.tags.size > 0 %}<div class="tags">{% for t in page.tags %}<span>{{ t }}</span>{% endfor %}</div>{% endif %}
  <a class="back" href="{{ '/' | relative_url }}">← همهٔ نوشته‌ها</a>
</article>
